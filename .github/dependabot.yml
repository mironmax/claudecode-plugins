version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/knowledge-graph"
    schedule:
      interval: "weekly"
    # Version updates off: requirements are floors, so a fresh install already
    # resolves to current releases and a floor bump only forces older venvs to
    # upgrade. Security updates are not subject to this limit and still open.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
